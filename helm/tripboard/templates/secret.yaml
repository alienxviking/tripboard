{{- if not .Values.postgres.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tripboard.fullname" . }}-db
  labels:
    {{- include "tripboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  DATABASE_URL: "postgresql+psycopg://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@{{ include "tripboard.fullname" . }}-postgres:5432/{{ .Values.postgres.database }}"
{{- end }}
