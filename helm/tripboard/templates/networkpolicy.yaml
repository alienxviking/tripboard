{{- if .Values.networkPolicy.enabled }}
# only the backend may talk to postgres
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tripboard.fullname" . }}-postgres
  labels:
    {{- include "tripboard.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tripboard.selector" (dict "root" . "component" "postgres") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "tripboard.selector" (dict "root" . "component" "backend") | nindent 14 }}
      ports:
        - port: 5432
{{- end }}
