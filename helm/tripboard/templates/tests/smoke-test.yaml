apiVersion: v1
kind: Pod
metadata:
  name: {{ include "tripboard.fullname" . }}-smoke-test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: smoke
      image: curlimages/curl:8.11.1
      securityContext:
        {{- include "tripboard.containerSecurity" . | nindent 8 }}
      command:
        - sh
        - -c
        - |
          set -e
          curl -sf http://{{ include "tripboard.fullname" . }}-backend:8000/ready
          curl -sf http://{{ include "tripboard.fullname" . }}-frontend:8080/healthz
          curl -sf http://{{ include "tripboard.fullname" . }}-frontend:8080/api/trips
