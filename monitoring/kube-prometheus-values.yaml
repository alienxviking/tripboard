# kube-prometheus-stack (installed by terraform/addons.tf)
grafana:
  adminPassword: tripboard-grafana   # lab only - use an existingSecret in a real cluster
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts: [grafana.local]
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
prometheus:
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts: [prometheus.local]
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 2d
alertmanager:
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts: [alertmanager.local]
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
