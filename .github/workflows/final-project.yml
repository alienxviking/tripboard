name: Final Project - TripBoard CI/CD

on:
  push:
    branches: [main]
    paths:
      - "final-devops-project/**"
      - "!final-devops-project/gitops/**"
      - "!final-devops-project/**/*.md"
      - "!final-devops-project/screenshots/**"
      - ".github/workflows/final-project.yml"
  pull_request:
    branches: [main]
    paths:
      - "final-devops-project/application/**"
      - "final-devops-project/docker/**"
      - "final-devops-project/helm/**"
  workflow_dispatch:

env:
  PROJECT: final-devops-project
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # ------------------------------------------------------------------ CI
  backend-test:
    name: Backend - lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: final-devops-project/application/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: final-devops-project/application/backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: flake8 .
      - name: pytest (fails the build on any failing test)
        run: pytest -v --cov=app --cov-report=term --cov-report=xml --junitxml=test-results.xml
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: backend-test-results
          path: |
            final-devops-project/application/backend/test-results.xml
            final-devops-project/application/backend/coverage.xml

  frontend-build:
    name: Frontend - build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: final-devops-project/application/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: final-devops-project/application/frontend/dist

  sast:
    name: SAST - Bandit + Semgrep
    needs: backend-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install bandit==1.9.4 semgrep==1.180.0
      - run: bandit -r $PROJECT/application/backend/app -c $PROJECT/security/bandit.yaml --severity-level medium
      - run: semgrep scan --config p/python --config p/react --config p/dockerfile --error --metrics=off $PROJECT/application $PROJECT/docker

  sca:
    name: SCA - pip-audit + npm audit
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: pip install pip-audit==2.10.1
      - name: pip-audit (backend dependencies)
        run: pip-audit -r $PROJECT/application/backend/requirements.txt --desc
      - name: npm audit (frontend dependencies)
        working-directory: final-devops-project/application/frontend
        run: npm install --no-fund --package-lock-only && npm audit --audit-level=high

  secret-scan:
    name: Secret scan - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            dir /repo/$PROJECT --config /repo/$PROJECT/security/gitleaks.toml -v

  docker-build:
    name: Docker build (${{ matrix.component }})
    needs: [sast, sca, secret-scan]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          docker build --build-arg APP_VERSION=${GITHUB_SHA::7} \
            -f $PROJECT/docker/${{ matrix.component }}.Dockerfile \
            -t tripboard-${{ matrix.component }}:${GITHUB_SHA::7} $PROJECT
      - name: Trivy image scan - fail on fixable HIGH/CRITICAL
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.2 image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            tripboard-${{ matrix.component }}:${GITHUB_SHA::7}
      - run: docker save tripboard-${{ matrix.component }}:${GITHUB_SHA::7} -o ${{ matrix.component }}.tar
      - uses: actions/upload-artifact@v5
        with:
          name: image-${{ matrix.component }}
          path: ${{ matrix.component }}.tar
          retention-days: 2

  # ------------------------------------------------------------------ CD
  push:
    name: Push images to GHCR (tag = commit SHA)
    needs: docker-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: image-*
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          for c in backend frontend; do
            docker load -i $c.tar
            docker tag tripboard-$c:${GITHUB_SHA::7} $REGISTRY/tripboard-$c:${GITHUB_SHA::7}
            docker push $REGISTRY/tripboard-$c:${GITHUB_SHA::7}
          done

  deploy-test:
    name: Deploy to test cluster (kind + Helm)
    needs: push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: helm/kind-action@v1
        with:
          cluster_name: ci
      - name: helm upgrade --install
        run: |
          kubectl apply -f $PROJECT/kubernetes/namespace.yaml
          helm upgrade --install tripboard $PROJECT/helm/tripboard -n tripboard \
            --set image.backend.tag=${GITHUB_SHA::7} --set image.frontend.tag=${GITHUB_SHA::7} \
            --set monitoring.serviceMonitor=false --set ingress.enabled=false \
            --wait --timeout 5m
          kubectl get pods,svc -n tripboard
      - name: helm test + API smoke test
        run: |
          helm test tripboard -n tripboard
          kubectl port-forward -n tripboard svc/tripboard-frontend 8080:8080 &
          sleep 3
          curl -sf -X POST localhost:8080/api/trips -H 'Content-Type: application/json' \
            -d '{"destination":"CI smoke test","start_date":"2026-01-01","end_date":"2026-01-02","budget":1}'
          curl -sf localhost:8080/api/trips

  gitops-update:
    name: Update GitOps manifest (Argo CD deploys it)
    needs: deploy-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Set new image tags in gitops/values-prod.yaml
        run: |
          SHORT=${GITHUB_SHA::7}
          sed -i -E "s/^(\s+tag: )\"[0-9a-f]{7}\"/\1\"$SHORT\"/" $PROJECT/gitops/values-prod.yaml
          git diff
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $PROJECT/gitops/values-prod.yaml
          git commit -m "deploy: tripboard ${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push origin HEAD:main
